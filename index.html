<div class="grid" id="plates"></div>

      <div id="modal-price"></div>
    </div>
    <a class="tel" href="tel:0618926416">061-892-6416 K.สิตา</a>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;">
      <a href="tel:0618926416" style="background:#1b5e20;color:#fff;border-radius:10px;padding:10px 24px;font-size:16px;font-weight:700;text-decoration:none;">📞 โทรเลย</a>

</div>
